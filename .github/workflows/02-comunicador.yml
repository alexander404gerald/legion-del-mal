
name: Comunicador de la legión

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options: 
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac
          - Thanos
      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: 'La misión fue un éxito'

      cow_character:
        description: "Personaje"
        required: true
        type: choice
        options: 
          - eyes
          - tux
          - dragon
          - ghostbusters
          - stegosaurus
          - fox
          - king
          - moose

      prioridad:
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options: 
          - 🟢 Normal 
          - 🟡 Alta
          - 🔴 Crítica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la legión
        run: sudo apt-get install -y cowsay

      - name: imprimir inputs
        run: |
         echo "================================"
         echo "     Transmisión interceptada"
         echo "================================"
         echo ""
         echo "De: ${{ inputs.villano }}"
         echo ""
         echo "Fecha: $(date -u +%Y-%m-%dT%H:%M UTC)"
         echo "----- Mensaje -----"
         cowsay -f eyes "${{ inputs.mensaje }}"
         echo ""
         echo "--- ${{ inputs.villano }} ---"
         echo "..."
